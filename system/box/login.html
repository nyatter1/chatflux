<div id="login_form_box">
	<div class="modal_title">
		Login	</div>
	<div class="modal_content login_modal_content">
		<div class="bpad15">
			<input id="user_username" class="user_username full_input login_text_input" type="text" maxlength="50" name="username" autocomplete="username" placeholder="Username/Email">
		</div>
		<div class="password_toggle_wrap">
			<input id="user_password" class="full_input login_text_input" maxlength="24" type="password" name="password" autocomplete="current-password" placeholder="Password">
			<span class="password_eye" onclick="togglePasswordView('user_password', this);"><i class="fa-regular fa-eye"></i></span>
		</div>
	</div>
	<div class="modal_control">
		<button onclick="sendLogin();" type="button" class="theme_btn full_button large_button"><i class="fa fa-sign-in"></i> Login</button>
		<div class="forgot_pass_elem tpad15">
			<p onclick="getRecovery();" class="forgot_password text_small bclick sub_text">Forgot password?</p>
		</div>
	</div>
</div>
